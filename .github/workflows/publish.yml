# Publishes the package to npm via trusted publishing (OIDC). No npm token is stored anywhere.
# One-time setup on npmjs.com: package settings -> Trusted Publisher -> GitHub Actions,
# repository abhay-avagama/hiring-agent, workflow publish.yml.
name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest   # trusted publishing needs npm 11.5.1 or newer
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Check tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package version v$version"; exit 1; }
      - name: Skip if this version is already on npm
        id: check
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "openings@$version" version >/dev/null 2>&1; then echo "published=true" >> "$GITHUB_OUTPUT"; echo "openings@$version already on npm, skipping"; fi
      - if: steps.check.outputs.published != 'true'
        run: npm publish --access public
      # The MCP registry lists the hosted server at openings.avagama.co, and the listing carries a version of its
      # own. Taking it from the tag keeps it level with npm without a second file to remember at release time.
      - name: Publish the server to the MCP registry
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          if [ -z "$MCP_PRIVATE_KEY" ]; then echo "no MCP_PRIVATE_KEY secret; skipping the registry publish"; exit 0; fi
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          jq --arg v "${GITHUB_REF_NAME#v}" '.version = $v' server.json > server.tmp && mv server.tmp server.json
          ./mcp-publisher login dns --domain avagama.co --private-key "$MCP_PRIVATE_KEY"
          ./mcp-publisher publish
      - name: Create the GitHub release with the registry tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "release exists, skipping"; exit 0; fi
          for i in $(seq 1 30); do curl -fsSL -o "openings-$version.tgz" "https://registry.npmjs.org/openings/-/openings-$version.tgz" && break || sleep 20; done
          gh release create "$GITHUB_REF_NAME" "openings-$version.tgz" --title "openings $version" --generate-notes --latest
